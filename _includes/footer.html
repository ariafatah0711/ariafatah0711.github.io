		<!-- ========== App Scripts ========== -->
	<script src="assets/js/main.js" defer></script>

	<script src="assets/js/projects.js" defer></script>
	<script src="assets/js/info.js" defer></script>
	<script src="assets/js/components/disqus.js" defer></script>

	<script src="assets/js/components/about-mobile-handler.js"></script>
	<script src="assets/js/components/confirm-modal.js"></script>
	<script src="assets/js/components/linktree.js"></script>

	<!-- ========== Modals & Components ========== -->
	{% include modals/image-modal.html %}
	{% include components/confirm-modal.html %}

	<!-- ========== Discord Integration ========== -->
	{% if site.app.show_discord.active %}
	<script src="assets/js/discord-lanyard.js" defer></script>
	{% endif %}

	<!-- ========== Song Player ========== -->
	{% if site.app.toggle_song.active %}
	<script src="assets/js/song.js" defer></script>
	{% endif %}

	<!-- ========== Analytics ========== -->
	{% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{site.google_analytics}}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{site.google_analytics}}');
    </script>
	{% endif %}

	<!-- ========== Cursor Effects ========== -->
	{% if site.app.cursor_splash.active %}
	<script src="/assets/js/cursor/splashCursor.js" defer></script>
	{% endif %}

	<!-- ========== Pjax Init ========== -->
	<script>
	(function () {
		if (!window.Pjax) return; // library not loaded
		// Initialize Pjax to only swap title and main content
		var pjax = new Pjax({
			elements: 'a[href]:not([target]):not([download]):not([data-no-pjax])',
			selectors: ['title', '#pjax-content'],
			switches: {
				'#pjax-content': function (oldEl, newEl, options) {
					oldEl.innerHTML = newEl.innerHTML;
				}
			}
		});

		// Re-run lightweight UI hooks after navigation
		document.addEventListener('pjax:success', function () {
			// Central re-init hook (theme, widgets, Disqus reset, etc)
			try { if (typeof window.reinitAfterPjax === 'function') window.reinitAfterPjax(); } catch (e) {}
		});
	})();
	</script>
</body>
</html>
