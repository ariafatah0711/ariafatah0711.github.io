{% comment %}
Redirect Handler Component
Handles page redirects
{% endcomment %}

<div
  data-redirect-handler
  data-redirect-url="{{ page.url_to_redirect }}"
  data-next-url="{% if page.next %}{{ page.next.url | relative_url }}{% endif %}"
  data-prev-url="{% if page.previous %}{{ page.previous.url | relative_url }}{% endif %}"
  style="display:none;"
></div>
