{% comment %}
About Navbar Component
Navigation bar for about layout
{% endcomment %}

<nav class="about-navbar">
	<a href="{{ '/' | relative_url }}">home</a>
	{% for item in site.app.navbar %}
		{% assign nav_url = item.url | to_s %}
		{% if nav_url contains '://' %}
			<a href="{{ nav_url }}">{{ item.name }}</a>
		{% else %}
			<a href="{{ nav_url | relative_url }}">{{ item.name }}</a>
		{% endif %}
	{% endfor %}
</nav>
