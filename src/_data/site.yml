      url: /achievements
    - name: projects
      url: /projects
  linktree:
    active: true
    groups:
      - title: Linktree
        links:
          - name: WhatsApp
            url: https://wa.me/+6289509221496
      - title: My Web
        links:
          - name: achievements
            url: /achievements
