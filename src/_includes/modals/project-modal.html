{% comment %}
Project Modal Component
Displays project details in modal with GitHub stats inline with title
{% endcomment %}

<div id="projectModal" class="modal" role="dialog" aria-modal="true" aria-label="Project details">
  <button class="close" id="projectClose" title="Close (Esc)" aria-label="Close modal">&times;</button>
  <div class="modal-nav prev" id="projectPrev" role="button" aria-label="Previous image">
    <span class="nav-icon" aria-hidden="true">&#10094;</span>
  </div>
  <div class="modal-nav next" id="projectNext" role="button" aria-label="Next image">
    <span class="nav-icon" aria-hidden="true">&#10095;</span>
  </div>
  <div class="modal-body">
    <img class="modal-content" id="projectModalImg" alt="Project image preview" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" onload="this.style.display='block'; this.nextElementSibling.style.display='none';">
    <div class="image-fallback" style="display:none;"></div>
    <div class="modal-info project-modal-info" id="projectModalInfo">
      <div class="modal-header-row">
        <div class="modal-title" id="projectModalTitle"></div>
        <span class="modal-github-pill github-stars" id="projectModalStars" data-repo="" title="GitHub statistics" style="display:none;">
          <span class="github-stat" aria-label="Stars">
            <svg class="github-stat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path>
            </svg>
            <span class="star-count">0</span>
          </span>
          <span class="github-stat-sep" aria-hidden="true"></span>
          <span class="github-stat" aria-label="Forks">
            <svg class="github-stat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M17 6a3 3 0 1 0-2.83-4H14a3 3 0 0 0 3 3zM7 22a3 3 0 1 0-2.83-4H4a3 3 0 0 0 3 3zm0-17a3 3 0 1 0-2.83-4H4a3 3 0 0 0 3 3zm10 4.17V8a1 1 0 0 0-1-1H8a3 3 0 0 1 0 2h7v.17a3 3 0 0 0 0 5.66V18h-5.17a3 3 0 0 1 0 2H16a1 1 0 0 0 1-1v-1.17a3 3 0 0 0 0-5.66z"></path>
            </svg>
            <span class="fork-count">0</span>
          </span>
        </span>
      </div>
      <div class="modal-description" id="projectModalDescription"></div>
      <div class="modal-actions" id="projectModalActions">
        <a id="projectModalSource" class="modal-btn" href="#" target="_blank" rel="noopener" style="display:none;">
          <svg class="modal-btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
          </svg>
          Source
        </a>
        <a id="projectModalDemo" class="modal-btn modal-btn-primary" href="#" target="_blank" rel="noopener" style="display:none;">
          <svg class="modal-btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3m-2 16H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7z"/>
          </svg>
          Demo
        </a>
      </div>
      <div class="modal-counter" id="projectModalCounter"></div>
    </div>
  </div>
</div>
