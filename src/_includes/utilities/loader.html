{% comment %}
Page Loader Component

Simplified behavior:
- Shows only on full page loads.
- No "always_show" / per-route rules.
- No sessionStorage memory (reload = show again).
{% endcomment %}

<div id="page-loader" class="page-loader">
  <div id="loader-words"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
  body.loader-active,
  html.loader-active {
    overflow: hidden;
  }
</style>

<script>
(function() {
  const loader = document.getElementById("page-loader");
  const container = document.getElementById("loader-words");

  if (!loader || !container) return;

  {% if site.app.loader.custom_teks and site.app.loader.custom_teks.size > 0 %}
    let words = {{ site.app.loader.custom_teks | jsonify }};
  {% else %}
    let words = ["Loading", "Please wait"];
  {% endif %}

  // Hide overflow while loader is active
  document.documentElement.classList.add("loader-active");
  document.body.classList.add("loader-active");

  words.forEach(t => {
    const h1 = document.createElement("h1");
    h1.className = "header-text";
    h1.textContent = t;
    container.appendChild(h1);
  });

  function teardownLoader() {
    try { loader.remove(); } catch (e) {}
    document.documentElement.classList.remove("loader-active");
    document.body.classList.remove("loader-active");
  }

  window.addEventListener("load", function() {

    // If GSAP didn't load (CDN blocked/offline), don't get stuck.
    if (!window.gsap || typeof window.gsap.timeline !== "function") {
      // Small delay to avoid a flash on very fast loads
      window.setTimeout(teardownLoader, 200);
      return;
    }

    const tl = window.gsap.timeline();

    tl.from("#page-loader", {
      opacity: 0,
      scale: 0.95,
      duration: 0.8,
      ease: "cubic.inOut"
    });

    tl.to({}, {duration: 0.2});

    tl.to(".header-text", {
      y: "-100%",
      opacity: 1,
      duration: 0.85,
      ease: "cubic.out",
      stagger: {
        each: 0.8,
        onComplete() {
          gsap.to(this.targets()[0], {
            opacity: 0,
            duration: 0.3,
            ease: "cubic.inOut"
          });
        }
      }
    });

    tl.to("#page-loader", {
      opacity: 0,
      duration: 0.8,
      ease: "cubic.inOut",
      onComplete() {
        teardownLoader();
      }
    }, "+=0.3");

  });

})();
</script>
