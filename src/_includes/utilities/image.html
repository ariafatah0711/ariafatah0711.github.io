{% comment %}
Image Component - Reusable with fallback
Usage: {% include utilities/image.html src="url" alt="text" class="class" %}
{% endcomment %}

{% if src %}
  <img
    src="{{ src }}"
    alt="{{ alt | default: 'Image' }}"
    class="{{ class }}"
    loading="{{ loading | default: 'lazy' }}"
    {% if onerror %}
      onerror="{{ onerror }}"
    {% else %}
      onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
    {% endif %}
  >
  {% unless no_fallback %}
    <div class="image-fallback" style="display:none;"></div>
  {% endunless %}
{% endif %}
